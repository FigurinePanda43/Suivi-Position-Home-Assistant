export_csv:
  fields:
    filename:
      required: false
      example: "exports/presence_janvier.csv"
      selector:
        text:
    start_date:
      required: false
      example: "2025-01-01"
      selector:
        date:
    end_date:
      required: false
      example: "2025-01-31"
      selector:
        date:
    persons:
      required: false
      example: '["Jean", "person.marie"]'
      selector:
        text:
          multiple: true
    delimiter:
      required: false
      default: ","
      selector:
        select:
          options:
            - label: "Virgule (,) — standard"
              value: ","
            - label: "Point-virgule (;) — Excel français"
              value: ";"

export_excel:
  fields:
    filename:
      required: false
      example: "exports/rapport_presence"
      selector:
        text:
    start_date:
      required: false
      example: "2025-01-01"
      selector:
        date:
    end_date:
      required: false
      example: "2025-01-31"
      selector:
        date:
    persons:
      required: false
      example: '["Jean", "person.marie"]'
      selector:
        text:
          multiple: true

clear_history: {}
