# Tableau de bord « Présence » — Suivi de Présence 1.0.0
#
# Prérequis : l'intégration est installée et configurée. La carte
# `custom:suivi-presence-card` est chargée automatiquement par l'intégration :
# il n'y a AUCUNE ressource Lovelace à déclarer à la main.
#
# Installation :
#   Paramètres → Tableaux de bord → Ajouter un tableau de bord → « Nouveau tableau
#   de bord à partir de zéro » → ouvrir → ⋮ → Éditeur brut → coller ce fichier.
#
# Remplacez person.jean / person.marie par vos propres entités person.* dans les
# cartes natives `map`, `history-graph` et `logbook` (la carte personnalisée les
# découvre toute seule).
#
# Aucune carte HACS supplémentaire n'est nécessaire : tout ce qui n'est pas la
# carte personnalisée est une carte native de Home Assistant.

title: Présence
views:
  # ---------------------------------------------------------------------------
  # Vue 1 — Niveau 1 et 2 : qui est où, depuis quand, carte, déplacements.
  # ---------------------------------------------------------------------------
  - title: Présence
    path: presence
    icon: mdi:account-group
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          # Niveau 1 : position courante de chaque personne, fraîcheur des données,
          # alertes ; niveau 2 : résumé par zone et déplacements de la période ;
          # exports CSV / Excel de la période affichée.
          - type: custom:suivi-presence-card
            title: Suivi de Présence
            default_period: today
            show_summary: true
            show_history: true
            show_export: true
            history_limit: 30

      - type: grid
        cards:
          # Carte géographique native : position actuelle (cercle de précision GPS)
          # et trajet des dernières heures depuis l'historique du recorder.
          - type: map
            title: Positions
            entities:
              - person.jean
              - person.marie
            hours_to_show: 12
            auto_fit: true
            theme_mode: auto
            grid_options:
              rows: 6
              columns: full

          # Frise des zones par personne : lecture immédiate des allers-retours
          # du jour (natif, pas de dépendance).
          - type: history-graph
            title: Zones — dernières 24 h
            hours_to_show: 24
            entities:
              - entity: person.jean
              - entity: person.marie

  # ---------------------------------------------------------------------------
  # Vue 2 — Historique long : la carte en mode « analyse » (7 jours par défaut)
  # et le journal natif des changements de zone.
  # ---------------------------------------------------------------------------
  - title: Historique
    path: historique
    icon: mdi:history
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:suivi-presence-card
            title: Analyse de la période
            default_period: 7d
            show_summary: true
            show_history: true
            show_export: true
            history_limit: 100

      - type: grid
        cards:
          - type: history-graph
            title: Zones — 7 derniers jours
            hours_to_show: 168
            entities:
              - entity: person.jean
              - entity: person.marie
          - type: logbook
            title: Journal des déplacements
            hours_to_show: 72
            entities:
              - person.jean
              - person.marie

  # ---------------------------------------------------------------------------
  # Vue 3 — Niveau 3 : informations techniques, rarement consultées.
  # ---------------------------------------------------------------------------
  - title: Technique
    path: technique
    icon: mdi:cog-outline
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: entities
            title: Capteurs de l'intégration
            state_color: true
            entities:
              - entity: sensor.suivi_de_presence_suivi_presence
                name: Personnes suivies
              - entity: sensor.suivi_de_presence_personnes_a_domicile
                name: À domicile
              - entity: sensor.suivi_de_presence_personnes_absentes
                name: Absents
              - entity: sensor.suivi_de_presence_total_des_changements
                name: Changements enregistrés
              - type: attribute
                entity: sensor.suivi_de_presence_suivi_presence
                attribute: csv_path
                name: Fichier CSV
                icon: mdi:file-delimited-outline
              - type: attribute
                entity: sensor.suivi_de_presence_total_des_changements
                attribute: last_change
                name: Dernier changement enregistré
                icon: mdi:clock-outline
          - type: statistics-graph
            title: Changements de zone par jour
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types:
              - change
            entities:
              - entity: sensor.suivi_de_presence_total_des_changements
                name: Changements
